<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's - Mobile Edition</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; overflow: hidden; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .screen { position: absolute; width: 100%; height: 100%; display: none; background-size: cover; background-position: center; }
        .active { display: block; }

        /* Botões de Navegação */
        .btn-nav { position: absolute; bottom: 20px; padding: 15px; background: rgba(0,0,0,0.7); border: 1px solid white; color: white; cursor: pointer; }
        #btn-monitor { left: 50%; transform: translateX(-50%); }
        #btn-corredor-ir { left: 20px; }
        #btn-corredor-voltar { right: 20px; }

        /* Sistema de Câmeras */
        #camera-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; }
        .cam-view { width: 80%; height: 70%; border: 5px solid #333; margin-top: 20px; background-size: cover; }
        .cam-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .cam-btn { padding: 10px; background: #222; color: white; border: 1px solid #555; }
        #close-cam { position: absolute; top: 10px; right: 10px; font-size: 30px; cursor: pointer; }

        /* Mensagens de Fim de Jogo */
        #game-over-screen, #win-screen { display: none; text-align: center; background: black; z-index: 100; }
        #win-screen h1 { color: #00ff00; }
        #jumpscare-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 200; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu" class="screen active" style="background-image: url('https://github.com/buyookk/fo/blob/main/imagens/escrit%C3%B3rio.png?raw=true');">
        <div style="background: rgba(0,0,0,0.6); padding: 50px;">
            <h1>FNAF - MOBILE</h1>
            <button onclick="startGame()" style="padding: 20px; font-size: 20px;">CONTINUAR</button>
        </div>
    </div>

    <div id="office" class="screen" style="background-image: url('https://github.com/buyookk/fo/blob/main/imagens/escrit%C3%B3rio.png?raw=true');">
        <button id="btn-corredor-ir" class="btn-nav" onclick="goToCorridor()">OLHAR CORREDOR (ESQUERDA)</button>
        <button id="btn-monitor" class="btn-nav" onclick="openMonitor()">ABRIR MONITOR</button>
        <div id="timer" style="position: absolute; top: 10px; right: 10px; font-size: 24px;">5:00</div>
    </div>

    <div id="corridor" class="screen" onclick="flashLight()">
        <button id="btn-corredor-voltar" class="btn-nav" onclick="goToOffice()">VOLTAR (DIREITA)</button>
        <p style="position:absolute; top:10px; width:100%; text-align:center;">CLIQUE NA TELA PARA USAR A LANTERNA</p>
    </div>

    <div id="camera-ui">
        <span id="close-cam" onclick="closeMonitor()">[ X ]</span>
        <div id="cam-display" class="cam-view"></div>
        <div class="cam-buttons">
            <button class="cam-btn" onclick="viewCam('palco')">CAM 01 - PALCO</button>
            <button class="cam-btn" onclick="viewCam('cozinha')">CAM 02 - COZINHA</button>
            <button class="cam-btn" onclick="viewCam('gerador')">CAM 03 - GERADOR</button>
        </div>
    </div>

    <video id="jumpscare-video" src="https://github.com/buyookk/fo/blob/main/imagens/robolada.mp4?raw=true"></video>
    <div id="game-over-screen" class="screen">
        <h1 style="color: red; font-size: 50px;">GAME OVER</h1>
        <button onclick="location.reload()" style="padding: 15px;">VOLTAR AO MENU</button>
    </div>
    <div id="win-screen" class="screen">
        <h1>FIM DE TURNO</h1>
        <button onclick="location.reload()">MENU</button>
    </div>
</div>

<script>
    // Configurações das Imagens
    const imgs = {
        office: "https://github.com/buyookk/fo/blob/main/imagens/escrit%C3%B3rio.png?raw=true",
        corredor_escuro: "https://github.com/buyookk/fo/blob/main/imagens/corredor%20sem%20luz.png?raw=true",
        corredor_vazio: "https://github.com/buyookk/fo/blob/main/imagens/corredor.png?raw=true",
        corredor_freddy: "https://github.com/buyookk/fo/blob/main/imagens/freddy%20no%20corredor.png?raw=true",
        palco_vazio: "https://github.com/buyookk/fo/blob/main/imagens/palco.png?raw=true",
        palco_freddy: "https://github.com/buyookk/fo/blob/main/imagens/freddy%20no%20palco.png?raw=true",
        cozinha_vazia: "https://github.com/buyookk/fo/blob/main/imagens/cozinha%20sem%20o%20freddy.png?raw=true",
        cozinha_freddy: "https://github.com/buyookk/fo/blob/main/imagens/cozinha%20com%20freddy.jpeg?raw=true",
        gerador_vazio: "https://github.com/buyookk/fo/blob/main/imagens/gerador%20sem%20freddy.png?raw=true",
        gerador_freddy: "https://github.com/buyookk/fo/blob/main/imagens/freddy%20no%20palco.png?raw=true" // Usando palco como placeholder
    };

    let freddyLocation = "palco";
    let timeLeft = 300; // 5 minutos
    let gameActive = false;
    let isCamsOpen = false;

    // Iniciar Jogo
    function startGame() {
        document.getElementById('menu').classList.remove('active');
        document.getElementById('office').classList.add('active');
        gameActive = true;
        startTimer();
        moveFreddy();
    }

    // Cronômetro
    function startTimer() {
        const timerLabel = document.getElementById('timer');
        let countdown = setInterval(() => {
            if (!gameActive) { clearInterval(countdown); return; }
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            timerLabel.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) {
                gameActive = false;
                document.getElementById('win-screen').style.display = 'block';
            }
        }, 1000);
    }

    // Movimentação do Freddy (Imprevisível)
    function moveFreddy() {
        let ai = setInterval(() => {
            if (!gameActive) { clearInterval(ai); return; }
            const locations = ["palco", "cozinha", "gerador", "corredor", "sala"];
            let currentIndex = locations.indexOf(freddyLocation);
            if (Math.random() > 0.5) { // 50% de chance de mover
                freddyLocation = locations[currentIndex + 1] || "sala";
            }
        }, 10000); // Tenta mover a cada 10 segundos
    }

    // Navegação
    function goToCorridor() {
        if (isCamsOpen) return;
        document.getElementById('office').classList.remove('active');
        const corr = document.getElementById('corridor');
        corr.classList.add('active');
        corr.style.backgroundImage = `url('${imgs.corredor_escuro}')`;
    }

    function goToOffice() {
        document.getElementById('corridor').classList.remove('active');
        document.getElementById('office').classList.add('active');
        // Se fechar o monitor e o Freddy estiver na sala = Jumpscare
        if (freddyLocation === "sala") triggerJumpscare();
    }

    function flashLight() {
        const corr = document.getElementById('corridor');
        if (freddyLocation === "corredor") {
            corr.style.backgroundImage = `url('${imgs.corredor_freddy}')`;
            setTimeout(() => { freddyLocation = "palco"; }, 1000); // Freddy foge
        } else {
            corr.style.backgroundImage = `url('${imgs.corredor_vazio}')`;
        }
        setTimeout(() => { corr.style.backgroundImage = `url('${imgs.corredor_escuro}')`; }, 500);
    }

    // Monitor
    function openMonitor() {
        isCamsOpen = true;
        document.getElementById('camera-ui').style.display = 'flex';
        viewCam('palco');
    }

    function closeMonitor() {
        isCamsOpen = false;
        document.getElementById('camera-ui').style.display = 'none';
        if (freddyLocation === "sala") triggerJumpscare();
    }

    function viewCam(name) {
        const display = document.getElementById('cam-display');
        let imgUrl = imgs[`${name}_vazio`];
        if (freddyLocation === name) imgUrl = imgs[`${name}_freddy`];
        display.style.backgroundImage = `url('${imgUrl}')`;
    }

    // Fim de Jogo
    function triggerJumpscare() {
        gameActive = false;
        const video = document.getElementById('jumpscare-video');
        video.style.display = 'block';
        video.play();
        video.onended = () => {
            video.style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'block';
        };
    }
</script>
</body>
</html>
