<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FNAF Pelúcia - Noite 1</title>
    
    <style>
        /* AQUI É O CSS (O VISUAL) */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: black; color: white;
        }

        #tela-menu, #tela-jogo {
            width: 100%; height: 100%; position: relative;
        }

        img { width: 100%; height: 100%; object-fit: contain; }

        /* ÁREA DO BOTÃO CONTINUE (Ajuste o 'top' e 'left' se precisar) */
        #botao-continue {
            position: absolute;
            width: 250px; height: 60px;
            left: 50px; top: 60%; /* Fica mais ou menos onde o texto aparece */
            cursor: pointer;
            background: rgba(255, 0, 0, 0); /* Invisível */
        }

        /* BOTÕES DO JOGO */
        .controles {
            position: absolute; bottom: 20px; width: 100%;
            display: flex; justify-content: space-around;
        }

        button {
            padding: 15px; background: rgba(0,0,0,0.7);
            color: white; border: 1px solid white; border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="tela-menu">
        <img src="imagens/menu.jpg" alt="Menu">
        <div id="botao-continue" onclick="comecarNoite()"></div>
    </div>

    <div id="tela-jogo" style="display: none;">
        <img id="cenario" src="imagens/sala.jpg">
        
        <div class="controles">
            <button onclick="olharEsquerda()">ESQUERDA</button>
            <button id="btn-lanterna" style="display:none;" onclick="lanterna()">LANTERNA</button>
            <button onclick="olharCentro()">CENTRO</button>
        </div>
    </div>

    <script>
        /* AQUI É O JS (A LÓGICA) */
        function comecarNoite() {
            document.getElementById('tela-menu').style.display = 'none';
            document.getElementById('tela-jogo').style.display = 'block';
            
            // Faz o celular dar um sinal de vida ao começar
            if (navigator.vibrate) { navigator.vibrate(200); }
        }

        function olharEsquerda() {
            // Troca a imagem para o corredor
            document.getElementById('cenario').src = 'imagens/corredor.jpg';
            document.getElementById('btn-lanterna').style.display = 'block';
        }

        function olharCentro() {
            // Volta para a sala
            document.getElementById('cenario').src = 'imagens/sala.jpg';
            document.getElementById('btn-lanterna').style.display = 'none';
        }

        function lanterna() {
            // Se clicar na lanterna, o celular vibra rápido (efeito de susto ou luz)
            if (navigator.vibrate) { navigator.vibrate(50); }
            alert("Luz ligada! (Aqui a gente vai trocar a imagem depois)");
        }
    </script>

</body>
</html>
