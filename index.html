<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freddy's Night - Fullscreen</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; overflow: hidden; user-select: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; }

        /* Telas Ocupando Tudo */
        .screen { position: absolute; width: 100%; height: 100%; display: none; background-size: cover; background-position: center; background-repeat: no-repeat; }
        .active { display: flex; flex-direction: column; justify-content: center; align-items: center; }

        /* Botões de Navegação Estilizados */
        .btn-nav { position: absolute; bottom: 30px; padding: 25px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); color: white; cursor: pointer; font-weight: bold; z-index: 10; border-radius: 10px; }
        #btn-to-corridor { left: 20px; }
        #btn-to-office { right: 20px; }
        #btn-monitor { bottom: 20px; left: 50%; transform: translateX(-50%); width: 250px; text-align: center; background: rgba(50,50,50,0.8); }

        /* Monitor de Câmeras (Tela Toda) */
        #camera-system { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 100; flex-direction: column; }
        #cam-display { width: 100%; height: 100%; background-size: cover; background-position: center; background-repeat: no-repeat; }
        
        .cam-controls { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 110; }
        .cam-btn { padding: 15px; background: rgba(0,0,0,0.8); color: white; border: 1px solid white; cursor: pointer; }
        #close-cam { position: absolute; top: 20px; right: 30px; font-size: 50px; color: red; cursor: pointer; z-index: 120; text-shadow: 2px 2px 5px black; }

        /* UI */
        #timer { position: absolute; top: 20px; right: 20px; font-size: 32px; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #555; z-index: 5; }
        
        /* Jumpscare */
        #jumpscare-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 500; }
        .end-screen { background: black; z-index: 600; text-align: center; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu" class="screen active" style="background-image: url('https://github.com/buyookk/fo/blob/main/imagens/escrit%C3%B3rio.png?raw=true');">
        <div style="background: rgba(0,0,0,0.8); padding: 40px; border-radius: 20px; text-align: center;">
            <h1 style="font-size: 45px; color: red;">FREDDY'S NIGHT</h1>
            <button onclick="startGame()" style="padding: 20px 50px; font-size: 25px; cursor: pointer; background: white; color: black; border: none; font-weight: bold;">CONTINUAR</button>
        </div>
    </div>

    <div id="office" class="screen" style="background-image: url('https://github.com/buyookk/fo/blob/main/imagens/escrit%C3%B3rio.png?raw=true');">
        <div id="timer">5:00</div>
        <div id="btn-to-corridor" class="btn-nav" onclick="changeRoom('corridor')">OLHAR CORREDOR</div>
        <div id="btn-monitor" class="btn-nav" onclick="toggleMonitor(true)">ABRIR MONITOR</div>
    </div>

    <div id="corridor" class="screen" onclick="useFlashlight()">
        <div id="btn-to-office" class="btn-nav" onclick="changeRoom('office')">VOLTAR</div>
    </div>

    <div id="camera-system">
        <div id="close-cam" onclick="toggleMonitor(false)">✖</div>
        <div id="cam-display"></div>
        <div class="cam-controls">
            <button class="cam-btn" onclick="updateCam('palco')">CAM 01</button>
            <button class="cam-btn" onclick="updateCam('cozinha')">CAM 02</button>
            <button class="cam-btn" onclick="updateCam('gerador')">CAM 03</button>
        </div>
    </div>

    <video id="jumpscare-video">
        <source src="https://github.com/buyookk/fo/blob/main/imagens/robolada.mp4?raw=true" type="video/mp4">
    </video>

    <div id="win-screen" class="screen end-screen">
        <h1 style="color: #00ff00; font-size: 60px;">FIM DE TURNO</h1>
        <button onclick="location.reload()" style="padding: 20px;">VOLTAR AO MENU</button>
    </div>

    <div id="game-over-screen" class="screen end-screen">
        <h1 style="color: red; font-size: 60px;">GAME OVER</h1>
        <button onclick="location.reload()" style="padding: 20px;">RECOMEÇAR</button>
    </div>
</div>

<script>
    const ASSETS = {
        office: "https://github.com/buyookk/fo/blob/main/imagens/escrit%C3%B3rio.png?raw=true",
        corredor_escuro: "https://github.com/buyookk/fo/blob/main/imagens/corredor%20sem%20luz.png?raw=true",
        corredor_vazio: "https://github.com/buyookk/fo/blob/main/imagens/corredor.png?raw=true",
        corredor_freddy: "https://github.com/buyookk/fo/blob/main/imagens/freddy%20no%20corredor.png?raw=true",
        palco_vazio: "https://github.com/buyookk/fo/blob/main/imagens/palco.png?raw=true",
        palco_freddy: "https://github.com/buyookk/fo/blob/main/imagens/freddy%20no%20palco.png?raw=true",
        cozinha_vazia: "https://github.com/buyookk/fo/blob/main/imagens/cozinha%20sem%20o%20freddy.png?raw=true",
        cozinha_freddy: "https://github.com/buyookk/fo/blob/main/imagens/cozinha%20com%20freddy.jpeg?raw=true",
        gerador_vazio: "https://github.com/buyookk/fo/blob/main/imagens/gerador%20sem%20freddy.png?raw=true",
        gerador_freddy: "https://github.com/buyookk/fo/blob/main/imagens/freddy%20no%20palco.png?raw=true" 
    };

    let freddyPos = "palco";
    let timeLeft = 300;
    let isPlaying = false;
    let currentRoom = "menu";
    let activeCam = "palco";

    function startGame() {
        isPlaying = true;
        changeRoom('office');
        startClock();
        freddyLoop();
    }

    function startClock() {
        const t = document.getElementById('timer');
        const clock = setInterval(() => {
            if (!isPlaying) { clearInterval(clock); return; }
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            t.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) { isPlaying = false; showEnd('win-screen'); }
        }, 1000);
    }

    function freddyLoop() {
        const path = ["palco", "cozinha", "gerador", "corredor", "sala"];
        const move = setInterval(() => {
            if (!isPlaying) { clearInterval(move); return; }
            let idx = path.indexOf(freddyPos);
            if (Math.random() > 0.4 && freddyPos !== "sala") {
                freddyPos = path[idx + 1];
                if (document.getElementById('camera-system').style.display === 'flex') updateCam(activeCam);
            }
        }, 7000); 
    }

    function changeRoom(room) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(room).classList.add('active');
        currentRoom = room;
        if (room === 'corridor') document.getElementById('corridor').style.backgroundImage = `url('${ASSETS.corredor_escuro}')`;
        if (room === 'office' && freddyPos === 'sala') triggerSusto();
    }

    function useFlashlight() {
        const corr = document.getElementById('corridor');
        if (freddyPos === "corredor") {
            corr.style.backgroundImage = `url('${ASSETS.corredor_freddy}')`;
            setTimeout(() => { freddyPos = "palco"; }, 1000);
        } else {
            corr.style.backgroundImage = `url('${ASSETS.corredor_vazio}')`;
        }
        setTimeout(() => { if (currentRoom === 'corridor') corr.style.backgroundImage = `url('${ASSETS.corredor_escuro}')`; }, 500);
    }

    function toggleMonitor(open) {
        const sys = document.getElementById('camera-system');
        sys.style.display = open ? 'flex' : 'none';
        if (open) updateCam(activeCam);
        if (!open && freddyPos === 'sala') triggerSusto();
    }

    function updateCam(name) {
        activeCam = name;
        const display = document.getElementById('cam-display');
        const img = (freddyPos === name) ? ASSETS[name + '_freddy'] : ASSETS[name + '_vazio'];
        display.style.backgroundImage = `url('${img}')`;
    }

    function triggerSusto() {
        isPlaying = false;
        const vid = document.getElementById('jumpscare-video');
        vid.style.display = 'block';
        vid.play();
        vid.onended = () => {
            vid.style.display = 'none';
            showEnd('game-over-screen');
        };
    }

    function showEnd(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
